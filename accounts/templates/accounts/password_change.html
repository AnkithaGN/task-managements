{% extends 'base.html' %}

{% block title %}Change password | Task Manager{% endblock %}

{% block content %}
    <h1>Change password</h1>

    <!-- Django's PasswordChangeForm: old password + new password twice.
         The same strength rules as registration apply. -->
    <form method="post" class="card form-card">
        {% csrf_token %}
        {% include 'includes/form_fields.html' %}
        <div class="actions">
            <button type="submit">Change password</button>
            <a class="btn btn-secondary" href="{% url 'profile' %}">Cancel</a>
        </div>
    </form>
{% endblock %}
