{% extends 'base.html' %}

{% block title %}Edit profile | Task Manager{% endblock %}

{% block content %}
    <h1>Edit profile</h1>
    <p>Username: <strong>{{ user.username }}</strong> (cannot be changed)</p>

    <form method="post">
        {% csrf_token %}
        {% include 'includes/form_fields.html' %}
        <button type="submit">Save changes</button>
        <a href="{% url 'profile' %}">Cancel</a>
    </form>
{% endblock %}
